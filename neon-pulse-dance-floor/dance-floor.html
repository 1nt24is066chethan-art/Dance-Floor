const room=new T.Mesh(new T.BoxGeometry(20,11,20),new T.MeshStandardMaterial({color:0x16161f,side:T.BackSide,roughness:.85}));room.position.y=5.4;S.add(room);

/* confetti */
const NC=500,cp=new Float32Array(NC*3),cvl=new Float32Array(NC*3),cc=new Float32Array(NC*3),cg=new T.BufferGeometry();

const lasers=[];for(let i=0;i<14;i++){const g=new T.CylinderGeometry(.012,.012,26,6);g.translate(0,-13,0);const m=new T.Mesh(g,new T.MeshBasicMaterial({color:0xff0044,transparent:true,opacity:.7,blending:T.AdditiveBlending,depthWrite:false}));m.position.set(i<7?(i-3)*2.4:(i-10)*2.4,10.6,i<7?-9:9);S.add(m);lasers.push(m)}

let ac,master,an,t0=0,nextT=0,step=0,noiseBuf,muted=false;const kicks=[];let fd=new Uint8Array(256);

function startAudio(){ac=new(window.AudioContext||window.webkitAudioContext)();master=ac.createGain();master.gain.value=+$('#v').value;
 const dc=ac.createDynamicsCompressor();an=ac.createAnalyser();an.fftSize=512;an.smoothingTimeConstant=.7;master.connect(dc);dc.connect(an);an.connect(ac.destination);fd=new Uint8Array(an.frequencyBinCount);
 noiseBuf=ac.createBuffer(1,ac.sampleRate,ac.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;

 if(k%4==0){osc('sine',170,t,.28,1,42);kicks.push([t,k==0])}

function mk(name,type,top,bot,hair){
 const root=new T.Group(),body=new T.Group(),tor=new T.Group(),hd=new T.Group();root.add(body);body.add(tor);tor.add(hd);hd.position.y=.7;
 const skin={human:0xf1c27d,robot:0xb8c4d6,cat:0xffa24d,alien:0x66ff99,bunny:0xf2eef5,panda:0xffffff,dino:0x5fd35f,astro:0xf4f4f4,wizard:0xf1c27d}[type];
 mesh(new T.CylinderGeometry(.27,.22,.62,14),M(top,.3),[0,.31,0],tor);mesh(new T.CylinderGeometry(.2,.21,.16,14),M(bot,.1),[0,-.04,0],tor);
 const eye=(x,y,z,r=.032,w=1)=>{if(w)mesh(new T.SphereGeometry(r*1.6,8,8),M(0xffffff,.3),[x,y,z+.005],hd);return mesh(new T.SphereGeometry(r,8,8),M(0x111111,0),[x,y,z+(w?r*1.2:0)],hd)};
 if(type=='robot'){mesh(new T.BoxGeometry(.42,.34,.38),M(skin,.2),[0,.2,0],hd);mesh(new T.BoxGeometry(.34,.1,.04),M(0x22e6ff,2.2),[0,.22,.2],hd);
  mesh(new T.CylinderGeometry(.015,.015,.2),M(0xaaaaaa),[0,.46,0],hd);mesh(new T.SphereGeometry(.05,8,8),M(0xff2fd6,2.5),[0,.58,0],hd)}
 else{const al_=type=='alien',h=mesh(new T.SphereGeometry(.23,18,14),M(skin,.12),[0,.23,0],hd);if(al_)h.scale.set(1.25,1.15,1.1);

/* poses: procedural dance clips driven by the music's beat phase B */
const B0=()=>({aL:[0,0,.12],aR:[0,0,-.12],eL:[-.2,0,0],eR:[-.2,0,0],hL:[0,0,0],hR:[0,0,0],kL:[0,0,0],kR:[0,0,0],tor:[0,0,0],hd:[0,0,0],hop:0,spin:0});
function pose(n,t,B){const P=B0(),b=ab(sn(B/2)),dn=1-b,w=sn(B/2),f=sn(B);
 if(n=='Idle'){P.tor[0]=sn(t*2)*.03;P.hd[0]=sn(t*2+1)*.04}
 else if(n=='Walk'){const p=t*9,q=cs(p);P.hL[0]=sn(p)*.8;P.hR[0]=-sn(p)*.8;P.kL[0]=Math.max(0,-q);P.kR[0]=Math.max(0,q);P.aL[0]=-sn(p)*.7;P.aR[0]=sn(p)*.7;P.eL[0]=P.eR[0]=-.5;P.tor[1]=sn(p)*.15}
 else if(n=='Dance1'){P.kL[0]=P.kR[0]=dn*.8;P.hL[0]=P.hR[0]=-dn*.4;P.aL=[-1.2+f*.5,0,.25];P.aR=[-1.2-f*.5,0,-.25];P.eL[0]=P.eR[0]=-1.3;P.tor=[dn*.1,w*.25,w*.12];P.hd=[dn*.25,0,0]}
 else if(n=='Dance2'){const sg=sn(B/8)>0?1:-1,u=sg>0?'L':'R',o=sg>0?'R':'L';P['a'+u]=[-.3,0,sg*(2.45+f*.15)];P['a'+o]=[-.2,0,-sg*.45];P['e'+o][0]=-1.8;
